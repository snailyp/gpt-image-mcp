[project]
name = "gpt-image-mcp"
version = "1.0.0"
description = "MCP server for OpenAI image generation via Responses API"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=3.2.0,<4.0.0",
    "openai>=1.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
]
